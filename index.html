<style>
/* Kantumruy Pro (SIL OFL 1.1) — bundled so Khmer displays correctly offline */
@font-face{font-family:'Kantumruy Pro';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/kantumruy-pro-khmer-400-normal.woff2) format('woff2');unicode-range:U+1780-17FF,U+19E0-19FF,U+200C-200D,U+25CC}
@font-face{font-family:'Kantumruy Pro';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/kantumruy-pro-khmer-600-normal.woff2) format('woff2');unicode-range:U+1780-17FF,U+19E0-19FF,U+200C-200D,U+25CC}
@font-face{font-family:'Kantumruy Pro';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/kantumruy-pro-khmer-700-normal.woff2) format('woff2');unicode-range:U+1780-17FF,U+19E0-19FF,U+200C-200D,U+25CC}
@font-face{font-family:'Kantumruy Pro';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/kantumruy-pro-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Kantumruy Pro';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/kantumruy-pro-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Kantumruy Pro';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/kantumruy-pro-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --blue:#2B3990; --blue-d:#1E2A6E; --blue-l:#E9ECF8; --red:#E31E24;
  --ink:#1B2033; --ink2:#4A5168; --ink3:#6B7186; --line:#DDE1EC; --bg:#F5F6FA; --card:#FFFFFF;
  --hi:#E02B2B; --hi-t:#FDE7E7; --hi-x:#9B1C1C;
  --mo:#FFC000; --mo-t:#FFF6DB; --mo-x:#6B4E00;
  --lo:#00A651; --lo-t:#E8F6EE; --lo-x:#146B3A;
  --ca:#8A939B; --ca-t:#F1F3F5; --ca-x:#4B5359;
  --radius:14px; --shadow:0 1px 2px rgba(20,30,70,.06),0 4px 14px rgba(20,30,70,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Kantumruy Pro','Noto Sans Khmer','Khmer OS',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
.mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;letter-spacing:.2px}
.hidden{display:none!important}
/* app bar */
.bar{position:sticky;top:0;z-index:30;background:var(--blue);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bar img{width:42px;height:42px;border-radius:10px;background:#fff;flex:none;padding:2px}
.bar .ttl{flex:1;min-width:0;line-height:1.25}
.bar .ttl b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl span{display:block;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.net{width:10px;height:10px;border-radius:50%;background:#7CE0A3;flex:none}
.net.off{background:#FFC000}
/* layout */
main{max-width:980px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}
h2.vt{font-size:20px;margin:6px 2px 12px;color:var(--blue-d)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.muted{color:var(--ink3)}
.small{font-size:14px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink3);font-size:12.5px;font-weight:600;border-radius:10px;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--blue);background:var(--blue-l)}
nav.tabs .cnt{position:absolute;top:2px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
@media (min-width:900px){
  nav.tabs{position:sticky;top:56px;bottom:auto;max-width:980px;margin:0 auto;border:0;background:transparent;padding:10px 14px 0;gap:6px}
  nav.tabs button{flex-direction:row;justify-content:center;gap:8px;font-size:15px;padding:10px;background:#fff;border:1px solid var(--line)}
  nav.tabs .cnt{position:static}
  main{padding-bottom:40px}
}
/* search */
.sbox{position:relative}
.sbox input{width:100%;border:2px solid var(--blue);border-radius:14px;padding:14px 92px 14px 48px;font-size:18px;background:#fff;outline:none;box-shadow:var(--shadow)}
.sbox input:focus{box-shadow:0 0 0 4px rgba(43,57,144,.15)}
.sbox .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--blue)}
.sbox input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.sbox .mic{position:absolute;right:48px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--blue);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sbox .mic svg{width:22px;height:22px}.sbox .mic.on{background:var(--red);color:#fff}
.sbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--blue-l);color:var(--blue);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14.5px;color:var(--ink2)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.r3.on{background:var(--hi);border-color:var(--hi)}
.chip.r2.on{background:var(--mo);border-color:var(--mo);color:#3D2E00}
.chip.r1.on{background:var(--lo);border-color:var(--lo)}
.meta{font-size:14px;color:var(--ink3);margin:4px 2px 8px}
/* rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.row{cursor:pointer}
.row:active{background:#FAFBFF}
.row:focus-visible{outline:3px solid rgba(43,57,144,.35);outline-offset:1px}
.row .ra-w{display:flex;flex-direction:column;gap:6px;flex:none;align-self:center}
.ra{width:40px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--blue);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0}
.ra:active{background:var(--blue-l)}
.ra.done{background:var(--lo-t);color:var(--lo-x);border-color:#BFE5CF}
.tag.w{background:#FFF6DB;color:#5E4500}.tag.x{background:var(--hi-t);color:var(--hi-x)}
.dym{background:#FFF8E1;border:1px solid #F3DE9A;border-radius:12px;padding:10px 12px;margin:4px 0 10px;font-size:15px}
.dym button{border:0;background:none;color:var(--blue);font-weight:700;text-decoration:underline;padding:0 2px;font-size:15px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tool{display:flex;gap:10px;align-items:center;text-align:left;padding:12px;background:#fff;border:1px solid var(--line);border-radius:14px;width:100%;color:var(--ink);text-decoration:none}
.tool .ti{width:40px;height:40px;border-radius:10px;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.tool b{display:block;font-size:15.5px;line-height:1.35}.tool span{display:block;font-size:13px;color:var(--ink3);line-height:1.35}
.cr{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cr .e{font-size:13px;color:var(--ink3)}
.row.r3{border-left-color:var(--hi)}.row.r2{border-left-color:var(--mo)}.row.r1{border-left-color:var(--lo)}.row.r0{border-left-color:var(--ca)}
.row .cd{flex:none;min-width:84px;font-weight:700;color:var(--blue-d);font-size:16.5px;padding-top:1px}
.row .tx{flex:1;min-width:0}
.row .t1{font-size:16px;line-height:1.45}
.row .t2{font-size:14.5px;color:var(--ink2);line-height:1.5;margin-top:2px}
.row .t3{font-size:13.5px;color:var(--ink3);margin-top:2px}
.row .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.row .go{flex:none;color:var(--ink3);align-self:center;font-size:20px}
mark{background:#FFF1A8;color:inherit;border-radius:3px;padding:0 1px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 9px;line-height:1.6;white-space:nowrap}
.tag.k{background:#EEF0FB;color:var(--blue)}
.tag.h{background:#F1F2F6;color:var(--ink2)}
.tag.l{background:#FFF0E6;color:#8A3C00}
.tag.ok{background:var(--lo-t);color:var(--lo-x)}
.rb{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;line-height:1.6;white-space:nowrap}
.rb::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.rb.r3{background:var(--hi-t);color:var(--hi-x)}.rb.r3::before{background:var(--hi)}
.rb.r2{background:var(--mo-t);color:var(--mo-x)}.rb.r2::before{background:var(--mo)}
.rb.r1{background:var(--lo-t);color:var(--lo-x)}.rb.r1::before{background:var(--lo)}
.rb.r0{background:var(--ca-t);color:var(--ca-x)}.rb.r0::before{background:var(--ca)}
.more{width:100%;margin-top:10px;border:1px dashed var(--blue);background:#fff;color:var(--blue);border-radius:12px;padding:12px;font-weight:600}
.empty{text-align:center;color:var(--ink3);padding:30px 10px}
/* home cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.svc{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:100%}
.svc .ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex:none}
.svc b{display:block;font-size:16px;line-height:1.35}
.svc span{display:block;font-size:13.5px;color:var(--ink3);line-height:1.4}
.sec{font-size:15px;font-weight:700;color:var(--blue-d);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:8px}
/* crumbs */
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:14px;margin:0 2px 10px}
.crumbs button{border:0;background:var(--blue-l);color:var(--blue);border-radius:8px;padding:3px 9px;font-size:14px}
.crumbs i{color:var(--ink3);font-style:normal}
.node{margin-bottom:10px}
/* segmented */
.seg{display:flex;background:#E6E9F2;border-radius:12px;padding:3px;margin:4px 0 10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:600;font-size:15px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.grp{font-size:14.5px;font-weight:700;color:var(--ink2);margin:14px 2px 6px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(15,20,45,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:6px 18px calc(22px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@media (min-width:760px){.ov{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:#D5D9E5;margin:6px auto 10px}
.sh-top{display:flex;align-items:center;gap:10px}
.sh-top .x{margin-left:auto;border:0;background:#EEF0F6;width:38px;height:38px;border-radius:50%;font-size:20px}
.bigcode{font-size:34px;font-weight:700;color:var(--blue-d);line-height:1.1}
.ttlen{font-size:19px;font-weight:600;margin:10px 0 4px;line-height:1.45}
.ttlkh{font-size:18px;color:var(--ink);margin:2px 0;line-height:1.7}
.ttlfr{font-size:15px;color:var(--ink3);font-style:italic;margin:2px 0}
.stat{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;margin:12px 0;font-size:15px}
.stat.ok{background:var(--lo-t);color:var(--lo-x)}
.stat.hd{background:#FFF6DB;color:#5E4500}
.stat.lc{background:#FFF0E6;color:#7A3500}
.rk{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.rk .h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600;font-size:15px}
.rk p{margin:6px 0 0;font-size:14.5px;color:var(--ink2)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 6px}
.btn{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:12px;padding:11px 12px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.p{background:var(--blue);color:#fff}
.btn.r{border-color:var(--red);color:var(--red)}
.btn.g{border-color:var(--line);color:var(--ink2)}
.btn:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 140px}
/* list tab */
.pl{display:flex;flex-direction:column;gap:8px}
.pi{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.pi .n{width:28px;height:28px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.pi .n.m{background:var(--blue);color:#fff}
.pi .b{flex:1;min-width:0}
.pi .b .c{font-weight:700;color:var(--blue-d)}
.pi .b .d{font-size:14.5px;color:var(--ink2);line-height:1.45}
.ib{border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;height:36px;font-size:16px;color:var(--ink2);flex:none}
label.f{display:block;font-size:14.5px;font-weight:600;color:var(--ink2);margin:12px 0 4px}
.in{width:100%;border:1px solid #C9CFDF;border-radius:10px;padding:11px 12px;font-size:16px;background:#fff}
textarea.in{min-height:96px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1B2033;color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.steps{margin:0;padding-left:22px}.steps li{margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.st b{display:block;font-size:26px;line-height:1.2;color:var(--blue-d)}.st span{font-size:13.5px;color:var(--ink3);line-height:1.35;display:block}
.tbw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.tb{width:100%;border-collapse:collapse;font-size:14.5px}
table.tb th,table.tb td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.tb th{background:var(--blue-l);color:var(--blue-d);font-weight:600;white-space:nowrap}
table.tb td.n,table.tb th.n{text-align:right;font-variant-numeric:tabular-nums}
.chart{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.key{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2);margin-right:14px}.key i{width:12px;height:12px;border-radius:3px;display:inline-block}
.setup{position:fixed;inset:0;z-index:95;background:linear-gradient(180deg,#2B3990 0,#2B3990 160px,#F5F6FA 160px);overflow:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 30px}
.setup .box{max-width:520px;margin:0 auto;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(20,30,70,.18);padding:20px 18px}
.setup .top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.setup .top img{width:64px;height:64px;border-radius:14px;border:1px solid var(--line)}
.setup h2{margin:0;font-size:20px;color:var(--blue-d);line-height:1.35}
.setup .req{color:var(--red)}
.setup .err{color:var(--hi-x);font-size:13.5px;margin-top:4px;min-height:1px}
.setup .why{background:var(--blue-l);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink2);margin:12px 0}
.saved{color:var(--lo-x);font-size:13.5px;font-weight:600;margin-left:6px}
.credit{text-align:center;padding:18px 10px 6px;color:var(--ink3);font-size:13.5px;line-height:1.6}
.credit b{color:var(--blue-d)}
.hero{display:flex;gap:14px;align-items:center}
.hero img{width:84px;height:84px;border-radius:14px;flex:none;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--ink3)}.kv dd{margin:0}
#qr{display:flex;justify-content:center;padding:10px}
#qr img,#qr canvas{width:180px!important;height:180px!important}
/* loader */
#load{position:fixed;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center}
#load img{width:150px;height:150px}
#load .pb{width:min(320px,80vw);height:8px;background:#E6E9F2;border-radius:4px;overflow:hidden}
#load .pb i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
/* print */
/* ===== Colourful theme (v1.5) — KCPH logo colours: deep blue, sky blue, Angkor gold, lotus red ===== */
:root{--navy:#16306B;--sky:#1E88E5;--sky2:#26A6E8;--gold:#F0A818;--lotus:#E53935;--mint:#12B886;--grape:#7048E8}
body{background:radial-gradient(circle at 0% 0%,#E2EDFF 0,transparent 38%),radial-gradient(circle at 100% 30%,#FFF1D6 0,transparent 32%),radial-gradient(circle at 20% 100%,#E6FCF5 0,transparent 35%),#F4F7FC;background-attachment:fixed}
.bar{background:linear-gradient(120deg,#16306B 0%,#1E5BB8 55%,#1E88E5 100%);box-shadow:0 4px 18px rgba(22,48,107,.35);border-bottom:3px solid var(--gold)}
.bar img{border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.lang{background:rgba(255,255,255,.18)}
.shero{margin:-14px -14px 16px;padding:16px 16px 14px;background:linear-gradient(135deg,#1E5BB8 0%,#1E88E5 55%,#26A6E8 100%);border-radius:0 0 26px 26px;position:relative;overflow:hidden;color:#fff;box-shadow:0 10px 24px rgba(30,91,184,.25)}
.shero::before{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(240,168,24,.55),rgba(240,168,24,0) 70%)}
.shero::after{content:"";position:absolute;left:-40px;bottom:-70px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),rgba(255,255,255,0) 70%)}
.shero>*{position:relative;z-index:1}
.hs-t .hi{font-size:21px;font-weight:700;line-height:1.3}
.hs-t .sub{font-size:14px;opacity:.92;margin:2px 0 12px}
.shero .sbox input{border:0;box-shadow:0 10px 26px rgba(10,30,80,.28);color:var(--ink)}
.deptcard .btn{padding:8px 12px;font-size:14px}
.shero .chips{margin:12px 0 0}
.shero .chip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff}
.shero .chip.on{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
.shero .chip.r3.on{background:var(--lotus);color:#fff;border-color:var(--lotus)}
@media (min-width:900px){.shero{margin:4px 0 16px;border-radius:24px}}
.chip{transition:transform .1s}.chip:active{transform:scale(.96)}
.chip.ex{border:0;font-weight:600}
.chip.ex:nth-child(6n+1){background:#E7F0FF;color:#1E5BB8}
.chip.ex:nth-child(6n+2){background:#FFF0E0;color:#C25700}
.chip.ex:nth-child(6n+3){background:#E6FCF5;color:#087F5B}
.chip.ex:nth-child(6n+4){background:#FFF0F6;color:#C2255C}
.chip.ex:nth-child(6n+5){background:#F3F0FF;color:#5F3DC4}
.chip.ex:nth-child(6n+6){background:#FFF9DB;color:#8F6400}
.chip.on:not(.r3){background:linear-gradient(135deg,#1E5BB8,#1E88E5);border-color:transparent;color:#fff}
.sec{color:var(--navy);font-size:16px}
.sec::before{content:"";width:6px;height:18px;border-radius:3px;background:linear-gradient(180deg,var(--gold),var(--lotus));flex:none}
.card{border-radius:16px;border-color:#E3E8F3;box-shadow:0 2px 6px rgba(20,40,90,.05),0 10px 24px rgba(20,40,90,.06)}
.deptcard{background:linear-gradient(120deg,#FFF8E6 0%,#FFFFFF 60%);border-left:5px solid var(--gold)}
.dico{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#FFD43B,#F0A818);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;box-shadow:0 4px 10px rgba(240,168,24,.35)}
.tool{border-radius:16px;border-color:#E3E8F3;box-shadow:0 2px 8px rgba(20,40,90,.06);transition:transform .12s}
.tool:active{transform:scale(.98)}
.tool .ti{width:46px;height:46px;border-radius:14px;color:#fff;font-weight:700;font-size:19px}
.tool .ti.g{background:linear-gradient(135deg,#20C997,#0CA678);box-shadow:0 4px 10px rgba(12,166,120,.3)}
.tool .ti.b{background:linear-gradient(135deg,#4DABF7,#1C7ED6);box-shadow:0 4px 10px rgba(28,126,214,.3)}
.tool .ti.o{background:linear-gradient(135deg,#FFA94D,#F76707);box-shadow:0 4px 10px rgba(247,103,7,.3);font-size:16px}
.svc{border:1px solid #E3E8F3;border-left:6px solid var(--c,#1E5BB8);border-radius:16px;background:linear-gradient(110deg,#FFFFFF 55%,#F7FAFF);box-shadow:0 2px 8px rgba(20,40,90,.06);transition:transform .12s}
.svc:active{transform:scale(.98)}
.svc .ico{width:52px;height:52px;border-radius:16px;font-size:26px;background-image:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,0))!important;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.svc b{color:var(--navy)}
.row{border-radius:14px;border-color:#E3E8F3;box-shadow:0 1px 3px rgba(20,40,90,.05);transition:box-shadow .15s,transform .1s}
.row:hover{box-shadow:0 6px 16px rgba(20,40,90,.1)}
.row:active{transform:scale(.995)}
.row.r3{background:linear-gradient(90deg,#FFF3F3 0,#FFFFFF 38%)}
.row.r2{background:linear-gradient(90deg,#FFF9E8 0,#FFFFFF 38%)}
.row.r1{background:linear-gradient(90deg,#EFFBF4 0,#FFFFFF 38%)}
.row .cd{min-width:0;flex:none;align-self:flex-start;background:#EAF1FF;color:#16306B;border-radius:9px;padding:3px 9px;font-size:15.5px}
.row.r3 .cd{background:#FDE2E2;color:#9B1C1C}.row.r2 .cd{background:#FFF0C2;color:#6B4E00}.row.r1 .cd{background:#D9F5E5;color:#146B3A}
.ra{border-radius:12px;border-color:#DCE6F7;background:#F2F7FF;color:#1E5BB8}
.ra[data-act="add"]{background:#EBFBEE;border-color:#C3EBCF;color:#2B8A3E}
.ra.done{background:#2B8A3E;color:#fff;border-color:#2B8A3E}
.btn{border-radius:14px}
.btn.p{background:linear-gradient(135deg,#1E5BB8,#1E88E5);border-color:transparent;box-shadow:0 6px 14px rgba(30,91,184,.25)}
.btn.r{background:#FFF5F5}
nav.tabs{box-shadow:0 -6px 20px rgba(20,40,90,.08);border-top:0}
nav.tabs button.on{background:linear-gradient(135deg,#1E5BB8,#1E88E5);color:#fff;box-shadow:0 4px 12px rgba(30,91,184,.3)}
nav.tabs button:not(.on):nth-child(1) svg{color:#1C7ED6}
nav.tabs button:not(.on):nth-child(2) svg{color:#D6336C}
nav.tabs button:not(.on):nth-child(3) svg{color:#0CA678}
nav.tabs button:not(.on):nth-child(4) svg{color:#F76707}
nav.tabs button:not(.on):nth-child(5) svg{color:#7048E8}
nav.tabs .cnt{background:var(--lotus)}
@media (min-width:900px){nav.tabs{box-shadow:none}nav.tabs button{border-radius:14px}}
.seg{background:#E6ECF7;border-radius:14px}
.seg button.on{color:#1E5BB8;box-shadow:0 2px 8px rgba(20,40,90,.12)}
.stats .st{border-radius:16px;border-top:4px solid #1E88E5;box-shadow:0 2px 8px rgba(20,40,90,.06)}
.stats .st:nth-child(5n+2){border-top-color:#F0A818}.stats .st:nth-child(5n+3){border-top-color:#12B886}.stats .st:nth-child(5n+4){border-top-color:#E64980}.stats .st:nth-child(5n+5){border-top-color:#7048E8}
.dhead{margin:-6px -18px 12px;padding:6px 18px 16px;background:linear-gradient(135deg,#16306B,#1E88E5);color:#fff;border-radius:20px 20px 0 0}
.dhead.r3{background:linear-gradient(135deg,#A61E1E,#E53935)}
.dhead.r2{background:linear-gradient(135deg,#F59F00,#FFD43B);color:#3D2E00}
.dhead.r1{background:linear-gradient(135deg,#087F5B,#20C997)}
.dhead.r0{background:linear-gradient(135deg,#495057,#868E96)}
.dhead .grab{background:rgba(255,255,255,.55)}
.dhead .bigcode,.dhead .ttlen,.dhead .ttlkh,.dhead .ttlfr,.dhead .crumbs,.dhead .crumbs i{color:inherit}
.dhead .ttlfr{opacity:.85}
.dhead .btn.g{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.55);color:inherit}
.dhead .x{background:rgba(255,255,255,.25);color:inherit}
.dhead .crumbs button{background:rgba(255,255,255,.22);color:inherit}
.sheet{box-shadow:0 -10px 40px rgba(10,20,60,.25)}
.hero{background:linear-gradient(120deg,#FFFFFF 50%,#EEF5FF);border-left:5px solid var(--sky)}
#load{background:linear-gradient(160deg,#FFFFFF 0%,#EAF2FF 60%,#FFF4DC 100%)}
#load .pb i{background:linear-gradient(90deg,#1E5BB8,#26A6E8,#F0A818)}
.setup{background:linear-gradient(160deg,#16306B 0,#1E5BB8 140px,#1E88E5 220px,#F4F7FC 220px)}
.toast{background:linear-gradient(135deg,#16306B,#1E5BB8)}
.empty{color:var(--ink2)}
/* ===== v1.7 tools ===== */
.tool .ti.v{background:linear-gradient(135deg,#9775FA,#6741D9);box-shadow:0 4px 10px rgba(103,65,217,.3)}
.tool .ti.p{background:linear-gradient(135deg,#F783AC,#D6336C);box-shadow:0 4px 10px rgba(214,51,108,.3)}
.tool .ti.r{background:linear-gradient(135deg,#FF8787,#E03131);box-shadow:0 4px 10px rgba(224,49,49,.3)}
.tool[disabled]{opacity:.5}
.chk{display:flex!important;gap:10px;align-items:flex-start;font-weight:500!important;line-height:1.45}.chk input{width:22px;height:22px;flex:none;margin-top:2px}
.dcimg{position:relative;margin-top:10px}.dcimg img{max-width:100%;max-height:320px;border-radius:12px;border:1px solid var(--line);display:block}.dcimg .ib{position:absolute;top:6px;right:6px;background:#fff}
.dci{display:flex;gap:8px;align-items:flex-start}.dci>input{width:22px;height:22px;margin-top:30px;flex:none}
.audit{background:#fff;border:1px solid #D9E4F5;border-top:5px solid #0CA678;border-radius:16px;padding:12px;margin:14px 0}
.au-h{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.au-s,.qzs{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;font-weight:800;font-size:20px;color:#fff;flex:none}
.au-s.g,.qzs.g{background:#0CA678}.au-s.y,.qzs.y{background:#F59F00}.au-s.r,.qzs.r{background:#E03131}
.qzs{width:96px;height:96px;font-size:28px;margin:4px auto 8px}
.au-i{display:flex;gap:8px;padding:9px 10px;border-radius:10px;margin:6px 0;font-size:14.5px;line-height:1.5}
.au-i.e{background:#FFF0F0;border-left:4px solid #E03131}.au-i.w{background:#FFF8E1;border-left:4px solid #F59F00}.au-i.i{background:#EEF4FF;border-left:4px solid #4C6EF5}
.rg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:420px){.rg2{grid-template-columns:1fr}}
.tscroll{overflow-x:auto}
.qzbar{height:8px;background:#E6ECF7;border-radius:9px;overflow:hidden}.qzbar i{display:block;height:100%;background:linear-gradient(90deg,#4DABF7,#1C7ED6)}
.qzq{font-size:17px;font-weight:600;line-height:1.5;color:var(--blue-d)}
.qzo{display:grid;gap:8px;margin-top:10px}
.qopt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:2px solid #DDE4F0;border-radius:14px;padding:12px;font-size:15px;color:var(--ink);width:100%}
.qopt b{min-width:80px;color:var(--blue-d)}.qopt span{flex:1}.qopt small{color:var(--ink3)}.qopt em{font-style:normal;font-weight:800;font-size:18px}
.qopt.ok{border-color:#0CA678;background:#E6FCF5}.qopt.bad{border-color:#E03131;background:#FFF0F0}.qopt.dim{opacity:.55}
.qzx{margin-top:10px;padding:12px;border-radius:12px;line-height:1.5}.qzx.ok{background:#E6FCF5}.qzx.bad{background:#FFF4E6}
/* ===== Smart search + AI (v1.6) ===== */
.ctxc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 2px 8px}
.cx{background:#E8F3FD;color:#0D47A1;border:1px solid #BBDCF8;border-radius:999px;padding:3px 10px;font-size:13.5px}
.tips{background:linear-gradient(135deg,#FFF8E1,#FFF3D6);border:1px solid #F3DE9A;border-left:5px solid #F0A818;border-radius:14px;padding:10px 12px;margin:8px 0 12px}
.tips-h{font-weight:700;color:#8A5A00;margin-bottom:4px}
.tip{font-size:14.5px;line-height:1.5;padding:6px 0;border-top:1px dashed #EAD49A}.tip:first-of-type{border-top:0}
.tipc{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip.tc{background:#fff;font-size:13px;padding:5px 10px;text-align:left}
.smart{background:#fff;border:1px solid #CFE0F7;border-top:5px solid #1E88E5;border-radius:16px;padding:10px 12px;margin:6px 0 12px;box-shadow:0 4px 14px rgba(22,48,107,.08)}
.smart-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;color:#16306B;margin-bottom:6px}
.btn.sm{padding:7px 12px;font-size:14px}
.sdx{margin:10px 0 4px}.sdx-h{font-weight:600;color:#16306B;margin:0 2px 6px;display:flex;gap:8px;align-items:center}
.sn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#16306B;color:#fff;font-size:13px;flex:none}
.aicard{background:linear-gradient(135deg,#F3EEFF,#EAF4FF);border:1px solid #D7CCF5;border-radius:16px;padding:12px;margin:14px 0}
.aicard.big{border-width:2px;border-color:#9C7BEA}
.ai-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ai-h b{color:#4527A0}.ai-h .small{color:#5E5A73}
.ai-i{font-size:28px;flex:none}
#aiOut .list{margin-top:10px}
.ai-msg{margin-top:10px;font-size:14.5px;background:#fff;border-radius:10px;padding:8px 10px}.ai-msg.warn{background:#FFF0F0;color:#B71C1C}
.ai-foot{font-size:12.5px;color:#6B6880;margin-top:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #B39DDB;border-top-color:#4527A0;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
#print{display:none}
@page{size:A4;margin:12mm 10mm 14mm;@bottom-right{content:counter(page) " / " counter(pages);font-size:9pt;color:#555}}
@media print{
  body{background:#fff;font-size:12pt}
  .bar,nav.tabs,main,.ov,.toast,#load{display:none!important}
  #print{display:block;padding:0 6mm}
  .ph{text-align:center;margin-bottom:10px}
  .ph img{width:90px;height:90px}
  .ph .h1{font-weight:700;font-size:13pt;margin-top:4px}
  .ph .h2{font-size:11pt}
  table.pt{width:100%;border-collapse:collapse;font-size:10.5pt;margin-top:12px}
  table.pt caption{caption-side:top;text-align:left;font-weight:700;font-size:11.5pt;padding:0 0 4px}
  table.pt thead{display:table-header-group}
  table.pt tr{break-inside:avoid;page-break-inside:avoid}
  table.pt th,table.pt td{border:1px solid #999;padding:5px 6px;text-align:left;vertical-align:top}
  table.pt th{background:#E9ECF8;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.pt td.n,table.pt th.n{text-align:right;white-space:nowrap}
  table.pt .nw{white-space:nowrap}
  table.pt.sm{font-size:9.5pt}
  .keep{break-inside:avoid;page-break-inside:avoid;margin-top:12px}
  #print h4{margin:0 0 4px;font-size:11.5pt}
  #print svg{width:100%;height:auto}
  .pf{margin-top:14px;font-size:9pt;color:#555;text-align:center}
}
</style>

<body>
<div id="load">
  <img id="ldLogo" alt="KCPH logo">
  <div style="font-weight:700;font-size:20px;color:#1E2A6E">KCPH ICD-10 Finder</div>
  <div class="muted" id="ldMsg">កំពុងផ្ទុកកូដ ICD-10 … / Loading ICD-10 codes …</div>

</div>

<header class="bar">

</header>

  <button data-v="search" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span data-t="tSearch"></span></button>
  <button data-v="services"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span data-t="tServices"></span></button>
  <button data-v="browse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h10M4 19h6"/></svg><span data-t="tBrowse"></span></button>
  <button data-v="mylist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1Z"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M8 12h8M8 16h5"/></svg><span data-t="tList"></span><em class="cnt hidden" id="listCnt"></em></button>

<main>
  <!-- SEARCH -->
  <section class="view on" id="v-search">
    <div class="shero"><div class="hs-t" id="heroT"></div>

      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

<script>
'use strict';
/* =====================================================================
   KCPH ICD-10 Finder
   Developed by Dr. Yeap Kong — Chief, Technical Office,
   Kampong Chhnang Provincial Hospital (KCPH), Cambodia.
   Codes: KCPH master list ICD10-Diagnosis_Updated_9.
   Risk colours: KCPH service workbooks (ANC/Maternity/PNC/Newborn,
   NCD, Surgery, Mental Health, Internal Medicine), Nov 2026.
   ===================================================================== */
const APP_VERSION = '1.7.0 (2026-11)';
const DATA_URL = 'icd10-data.json?v=2026-11a';
const FR_URL = 'icd10-fr.json?v=2026-11a';
const DATA_BYTES = 9429446;                // for the progress bar

    <label class="f">${t('fbFac')}</label><input class="in" id="fF" value="${esc(S.facility)}">
    <label class="f">${t('fbName')}</label><input class="in" id="fN" value="${esc(store.get('fbname', ''))}">
    <label class="f">${t('fbContact')}</label><input class="in" id="fP" value="${esc(store.get('fbcontact', ''))}">
    <div class="acts"><button class="btn g" id="fCan">${t('cancel')}</button><button class="btn p" id="fSend">${t('send')}</button></div>`);
  if (code) ov.querySelector('#fT').value = '1';

  ov.querySelector('#fSend').onclick = () => {

    store.set('fbname', ov.querySelector('#fN').value.trim()); store.set('fbcontact', ov.querySelector('#fP').value.trim());
    const k = +ov.querySelector('#fT').value;
    queue({ action: 'feedback', id: uid(), type: T.fbT.en[k], code: ov.querySelector('#fC').value.trim(), message: msg,
      facility: ov.querySelector('#fF').value.trim(), province: S.province, name: ov.querySelector('#fN').value.trim(), contact: ov.querySelector('#fP').value.trim(),
      lang: S.lang, app_version: APP_VERSION, sent_at: new Date().toISOString() });

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function queue(item) { const o = store.get('outbox', []).filter(x => x.id !== item.id); o.push(item); store.set('outbox', o.slice(-200)); flushOutbox(); }
function jsonp(params, ms) {
  return new Promise((res, rej) => {
    const cb = '__kcph_cb_' + uid(); const s = document.createElement('script');
    const tm = setTimeout(() => { cleanup(); rej(new Error('timeout')); }, ms || 15000);
    function cleanup() { clearTimeout(tm); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); res(d); };
    s.onerror = () => { cleanup(); rej(new Error('network')); };
    s.src = GAS_URL + '?' + new URLSearchParams(Object.assign({}, params, { callback: cb })).toString();
    document.body.appendChild(s);
  });
}
let flushing = false;
async function flushOutbox(manual) {
  if (!GAS_URL) { if (manual) toast(S.lang === 'kh' ? 'មិនទាន់ភ្ជាប់ម៉ាស៊ីនមេ (GAS_URL)' : 'Backend not configured yet (GAS_URL)'); return; }
  if (flushing || !navigator.onLine) return; flushing = true;
  try {
    let o = store.get('outbox', []);
    while (o.length) {
      const it = o[0];
      try { const r = await jsonp(it); if (!r || !r.ok) break; } catch (e) { break; }
      o = store.get('outbox', []).filter(x => x.id !== it.id); store.set('outbox', o);
    }
    if (manual) toast(o.length ? t('queued') : t('sentOk'));
  } finally { flushing = false; }
}
/* anonymous usage data: one row per device per day, updated during the day (no patient data, no search text) */
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const blankUse = () => ({ d: today(), o: 0, k: 0, s: 0, v: 0, a: 0, x: 0, p: 0, f: 0, i: 0, codes: {} });
function countUse(kind, code) {
  let u = store.get('use', null); if (!u || !u.d) u = blankUse();
  if (u.d !== today()) { sendUse(u); u = blankUse(); }
  const k = { open: 'o', click: 'k', search: 's', view: 'v', add: 'a', export: 'x', print: 'p', feedback: 'f', ai: 'i', quiz: 'z' }[kind];
  if (k) u[k] = (u[k] || 0) + 1;
  if (code && (kind === 'view' || kind === 'add')) { u.codes = u.codes || {}; u.codes[code] = (u.codes[code] || 0) + 1; }
  store.set('use', u); maybeSend(false);
}
let lastSend = 0;
function maybeSend(force) { const now = Date.now(); if (!force && now - lastSend < 10 * 60 * 1000) return; lastSend = now; const u = store.get('use', null); if (u) sendUse(u); }
function sendUse(u) {
  if (!u || !(u.o || u.k || u.s || u.v || u.a || u.x || u.p || u.f || u.i || u.z)) return;

function parseCodes(text) {

    if (!c.includes('.') && c.length > 3 && !/^OT/.test(c)) c = c.slice(0, 3) + '.' + c.slice(3);
    out.push({ raw, c });
  }
  return out;
}

    return { st: 'x', i: -1, near };

  if (FL[i] & 2) return { st: 'l', i };

}

      <p class="small muted" style="margin:0 2px 10px">${kh ? 'ករណីពិតពីសេវា KCPH។ ជ្រើសចម្លើយ មើលការពន្យល់ ហើយទទួលពិន្ទុ។ ល្អសម្រាប់វគ្គបណ្តុះបណ្តាលឆ្មប និងគ្រូពេទ្យ។' : 'Real cases from KCPH services. Choose the answer, read the explanation and get a score. Good for midwife and doctor training sessions.'}</p>
      <div class="card pad"><label class="f">${kh ? 'ប្រធានបទ' : 'Topic'}</label><div class="chips">${QSETS.map(s => `<button class="chip ${set === s[0] ? 'on' : ''}" data-qs="${s[0]}">${esc(kh ? s[2] : s[1])}</button>`).join('')}</div>
        <label class="f">${kh ? 'ឈ្មោះអ្នកចូលរួម (ស្រេចចិត្ត សម្រាប់កំណត់ត្រាវគ្គ)' : 'Your name (optional, for training records)'}</label><input class="in" id="qzName" value="${esc(store.get('qzName', ''))}" maxlength="60">
        <div class="btns" style="margin-top:12px"><button class="btn p" id="qzGo">▶ ${kh ? 'ចាប់ផ្តើម' : 'Start'} (${Math.min(10, cnt)} ${kh ? 'សំណួរ' : 'questions'})</button></div></div>
      ${(store.get('qzHist', [])).length ? `<div class="sec">${kh ? 'លទ្ធផលមុនៗ' : 'Previous results'}</div><div class="list">${store.get('qzHist', []).slice(-8).reverse().map(h => `<div class="cr"><b style="width:56px">${h.score}/${h.total}</b><div class="small">${esc(h.day)} · ${esc((QSETS.find(s => s[0] === h.set) || [])[kh ? 2 : 1] || '')}${h.name ? ' · ' + esc(h.name) : ''}</div></div>`).join('')}</div>` : ''}
      ${creditHTML()}`;
    out.querySelectorAll('[data-qs]').forEach(b => b.onclick = () => { store.set('qzSet', b.dataset.qs); renderQuiz(); });
    $('#qzName').oninput = e => store.set('qzName', e.target.value);
    $('#qzGo').onclick = () => {
      const pool = qbank.filter(q => set === 'all' || q[0] === set).map(q => [Math.random(), q]).sort((a, b) => a[0] - b[0]).map(x => x[1]).slice(0, 10);
      QZ = { stage: 'q', set, name: ($('#qzName').value || '').trim().slice(0, 60), qs: pool.map(q => ({ q, opts: q[3].map(c => [Math.random(), c]).sort((a, b) => a[0] - b[0]).map(x => x[1]), pick: null })), k: 0 };
      renderQuiz(); window.scrollTo(0, 0);
    };
    return;
  }
  if (QZ.stage === 'q') {
    const it = QZ.qs[QZ.k], q = it.q, done = it.pick !== null;
    out.innerHTML = `<div class="crumbs"><button id="qzQuit">‹ ${kh ? 'ចាកចេញ' : 'Quit'}</button></div>
      <div class="qzbar"><i style="width:${(QZ.k + (done ? 1 : 0)) / QZ.qs.length * 100}%"></i></div>
      <div class="small muted" style="margin:6px 2px">${kh ? 'សំណួរ' : 'Question'} ${QZ.k + 1}/${QZ.qs.length} · ${esc((QSETS.find(s => s[0] === q[0]) || [])[kh ? 2 : 1])}</div>
      <div class="card pad qzc"><div class="qzq">${esc(kh ? q[2] : q[1])}</div>${kh ? `<div class="small muted">${esc(q[1])}</div>` : ''}</div>
      <div class="qzo">${it.opts.map(c => { const i = IDX.get(c); const cls = !done ? '' : c === q[4] ? 'ok' : c === it.pick ? 'bad' : 'dim';
        return `<button class="qopt ${cls}" data-o="${esc(c)}" ${done ? 'disabled' : ''}><b class="mono">${esc(c)}</b><span>${esc((/^(with|without)\b/i.test(EN[i]) && PAR[i] >= 0 ? EN[PAR[i]] + ' – ' : '') + EN[i])}${KHL[i] ? `<br><small>${esc(KHL[i])}</small>` : ''}</span>${done && c === q[4] ? '<em>✓</em>' : done && c === it.pick ? '<em>✗</em>' : ''}</button>`; }).join('')}</div>
      ${done ? `<div class="qzx ${it.pick === q[4] ? 'ok' : 'bad'}"><b>${it.pick === q[4] ? (kh ? '✓ ត្រឹមត្រូវ!' : '✓ Correct!') : (kh ? '✗ មិនទាន់ត្រូវ — ចម្លើយ៖ ' : '✗ Not quite — answer: ') + (it.pick === q[4] ? '' : q[4])}</b><div>${esc(kh ? q[6] : q[5])}</div></div>
        <div class="btns" style="margin-top:12px"><button class="btn p" id="qzNext">${QZ.k + 1 < QZ.qs.length ? (kh ? 'បន្ទាប់ ›' : 'Next ›') : (kh ? 'មើលពិន្ទុ' : 'See score')}</button></div>` : ''}`;
    $('#qzQuit').onclick = () => { QZ = null; renderQuiz(); };
    out.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { it.pick = b.dataset.o; renderQuiz(); });
    const n = $('#qzNext'); if (n) n.onclick = () => { if (QZ.k + 1 < QZ.qs.length) QZ.k++; else finishQuiz(); renderQuiz(); window.scrollTo(0, 0); };
    return;
  }
  const sc = QZ.qs.filter(x => x.pick === x.q[4]).length, tot = QZ.qs.length, pc = Math.round(sc * 100 / tot);
  out.innerHTML = `<h2 class="vt">🎓 ${kh ? 'លទ្ធផល' : 'Your result'}</h2>
    <div class="card pad" style="text-align:center"><div class="qzs ${pc >= 80 ? 'g' : pc >= 50 ? 'y' : 'r'}">${sc}/${tot}</div><b>${pc}%</b> · ${pc >= 80 ? (kh ? 'ល្អណាស់! 🎉' : 'Excellent! 🎉') : pc >= 50 ? (kh ? 'ល្អ — បន្តហ្វឹកហាត់' : 'Good — keep practising') : (kh ? 'សូមអានការពន្យល់ ហើយសាកម្តងទៀត' : 'Read the explanations and try again')}
      ${QZ.name ? `<div class="small muted">${esc(QZ.name)} · ${esc(S.facility)}</div>` : ''}</div>
    ${QZ.qs.filter(x => x.pick !== x.q[4]).length ? `<div class="sec">${kh ? 'សំណួរដែលខុស' : 'Questions to review'}</div>${QZ.qs.filter(x => x.pick !== x.q[4]).map(x => `<div class="card pad" style="margin-bottom:8px"><div class="small">${esc(kh ? x.q[2] : x.q[1])}</div><div style="margin-top:6px"><span class="tag x">✗ ${esc(x.pick)}</span> <span class="tag ok">✓ ${esc(x.q[4])}</span> ${esc(EN[IDX.get(x.q[4])])}</div><div class="small muted" style="margin-top:4px">${esc(kh ? x.q[6] : x.q[5])}</div></div>`).join('')}` : ''}
    <div class="btns" style="margin-top:12px"><button class="btn p" id="qzAgain">↻ ${kh ? 'សាកម្តងទៀត' : 'Try again'}</button><button class="btn" id="qzHome">${kh ? 'ប្រធានបទផ្សេង' : 'Other topic'}</button></div>${creditHTML()}`;
  $('#qzAgain').onclick = () => { const s = QZ.set; QZ = null; store.set('qzSet', s); renderQuiz(); $('#qzGo').click(); };
  $('#qzHome').onclick = () => { QZ = null; renderQuiz(); };
}
function finishQuiz() {
  QZ.stage = 'done';
  const sc = QZ.qs.filter(x => x.pick === x.q[4]).length, tot = QZ.qs.length;
  const h = { day: today(), set: QZ.set, score: sc, total: tot, name: QZ.name }; const hist = store.get('qzHist', []); hist.push(h); store.set('qzHist', hist.slice(-50));
  queue({ action: 'quiz', id: (store.get('dev', '') || uid()) + '_q' + uid(), day: today(), name: QZ.name, set: QZ.set, score: sc, total: tot, wrong: QZ.qs.filter(x => x.pick !== x.q[4]).map(x => x.q[4]).join(' '),
    facility: S.facility, province: S.province, department: deptLabel('en') || 'GEN', lang: S.lang });
  countUse('quiz');
}

/* ---------- voice search (Chrome/Android; needs internet) ---------- */
function setupVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return;
  const b = $('#qMic'); b.classList.remove('hidden'); let rec = null;
  b.onclick = () => {
    if (rec) { rec.stop(); return; }
    if (!navigator.onLine) { toast(S.lang === 'kh' ? 'ត្រូវការអ៊ីនធឺណិត' : 'Internet connection needed'); return; }
    rec = new SR(); rec.lang = S.lang === 'kh' ? 'km-KH' : 'en-US'; rec.interimResults = true; rec.maxAlternatives = 1;
    b.classList.add('on'); toast(t('listen'));
    rec.onresult = e => { const tx = [...e.results].map(r => r[0].transcript).join(' '); $('#q').value = tx; doSearch(); };
    rec.onend = rec.onerror = () => { b.classList.remove('on'); rec = null; };
    try { rec.start(); } catch (e) { b.classList.remove('on'); rec = null; }
  };
}

/* ---------- utils ---------- */
function xlsx(file, ttl, head, rows, widths) {
  xlsxBook(file + '_' + new Date().toISOString().slice(0, 10), [{ name: 'ICD-10', title: ttl, head, rows, widths }]);
}
function xlsxBook(file, sheets) {
  if (!window.XLSX) { toast('Excel library not loaded'); return; }
  const d = new Date(), wb = XLSX.utils.book_new();
  sheets.forEach(sh => {
    const aoa = [[HOSP_EN + ' · ' + HOSP_KH], [sh.title], ['Generated ' + d.toLocaleString('en-GB') + ' · Codes: ' + (META.src || '')], [], sh.head, ...sh.rows, [], ['KCPH ICD-10 Finder — developed by ' + AUTHOR_EN + ', ' + AUTHOR_ROLE_EN]];
    const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = (sh.widths || []).map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws, sh.name.slice(0, 31));
  });
  wb.Props = { Title: sheets[0].title, Author: AUTHOR_EN, Company: HOSP_EN };
  XLSX.writeFile(wb, file + '.xlsx'); countUse('export');
}
async function copyText(s) {
  try { await navigator.clipboard.writeText(s); } catch (e) { const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (x) {} ta.remove(); }
  toast(t('copied'));
}
let toastT;
function toast(m) { let e = $('.toast'); if (!e) { e = document.createElement('div'); e.className = 'toast'; document.body.appendChild(e); } e.textContent = m; clearTimeout(toastT); toastT = setTimeout(() => e.remove(), 2200); }
function applyLang() {
  document.documentElement.lang = S.lang === 'kh' ? 'km' : 'en';
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
  $('#q').placeholder = t('qPh');
  $('#langBtn').textContent = S.lang === 'kh' ? 'English' : 'ខ្មែរ';
}
function setLang(l) { S.lang = l; saveS(); applyLang(); show(view); }
function netState() { $('#net').classList.toggle('off', !navigator.onLine); $('#net').title = navigator.onLine ? 'online' : 'offline'; if (navigator.onLine) flushOutbox(); }

/* ---------- start ---------- */
(async function start() {
  $('#barLogo').src = LOGO; applyLang();
  try { await loadData(); }
  catch (e) { $('#ldMsg').innerHTML = 'Could not load the code list. Please check the connection and reload.<br>មិនអាចផ្ទុកបញ្ជីកូដបានទេ។ សូមពិនិត្យអ៊ីនធឺណិត ហើយបើកម្តងទៀត។'; return; }
  if (S.fr) loadFr().then(() => show(view));
  $('#load').remove();
  if (needSetup()) renderSetup();
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { if (b.dataset.v === 'services' && view === 'services') curSvc = null; if (b.dataset.v === 'browse' && view === 'browse') brPath = []; show(b.dataset.v); });
  $('#langBtn').onclick = () => setLang(S.lang === 'kh' ? 'en' : 'kh');
  $('#q').addEventListener('input', doSearch);
  $('#q').addEventListener('keydown', e => {
    if (e.key === 'Enter') { clearTimeout(sTimer); renderSearch(); const f = $('#sOut .row[data-i]'); if (f && $('#q').value.trim()) openDetail(+f.dataset.i); else e.target.blur(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && curOv) { closeSheet(); return; }
    if (e.key === '/' && !curOv && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); if (view !== 'search') show('search'); $('#q').focus(); }
  });
  setupVoice();
  $('#qClr').onclick = () => { $('#q').value = ''; renderSearch(); $('#q').focus(); };
  document.querySelectorAll('#fChips .chip').forEach(c => c.onclick = () => { F[c.dataset.f] = !F[c.dataset.f]; pageLim.s = 0; renderSearch(); });
  window.addEventListener('online', netState); window.addEventListener('offline', netState); netState();
  updCount(); renderSearch(); countUse('open'); maybeSend(true);
  // deep link: index.html#J18.9 opens that code
  const goHash = () => { const h = decodeURIComponent(location.hash.slice(1)); if (['report', 'check', 'doc', 'stats', 'quiz'].includes(h)) show(h); else if (h && IDX.has(h)) openDetail(IDX.get(h)); };
  goHash(); window.addEventListener('hashchange', goHash);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
